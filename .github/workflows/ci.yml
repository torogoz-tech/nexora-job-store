name: Rust
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexora_test
          POSTGRES_PASSWORD: nexora_test_only
          POSTGRES_DB: nexora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexora_test -d nexora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install 1.100.0 --profile minimal --no-self-update
      - run: rustup component add rustfmt clippy --toolchain 1.100.0
      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked
      - run: cargo test --workspace --locked
        env:
          NEXORA_TEST_POSTGRES_HOST: 127.0.0.1
          NEXORA_TEST_POSTGRES_PORT: 5432
          NEXORA_TEST_POSTGRES_USER: nexora_test
          NEXORA_TEST_POSTGRES_PASSWORD: nexora_test_only
          NEXORA_TEST_POSTGRES_DATABASE: nexora_test
          NEXORA_TEST_POSTGRES_REQUIRED: true
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
