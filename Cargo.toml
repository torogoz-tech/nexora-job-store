[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nexora-git-policy = { path = "crates/nexora-git-policy", version = "0.4.0" }
nexora-database-connections = { path = "crates/nexora-database-connections", version = "0.4.0" }
nexora-core = { git = "https://github.com/torogoz-tech/nexora-platform-contracts.git", tag = "0.4.0-final" }
nexora-platform = { git = "https://github.com/torogoz-tech/nexora-platform-contracts.git", tag = "0.4.0-final" }
nexora-graph = { git = "https://github.com/torogoz-tech/nexora-analysis-engine.git", tag = "0.4.0" }
nexora-storage = { git = "https://github.com/torogoz-tech/nexora-analysis-engine.git", tag = "0.4.0" }
nexora-indexer = { git = "https://github.com/torogoz-tech/nexora-analysis-engine.git", tag = "0.4.0" }
postgres = { version = "0.19", features = ["with-serde_json-1"] }
redis = { version = "0.32", default-features = false }
ureq = { version = "3", default-features = false, features = ["json"] }
getrandom = "0.3"
sha2 = "0.10"
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc", "zeroize"] }
hkdf = "0.12.4"
zeroize = "1"
base64 = "0.22"
flate2 = "1"
